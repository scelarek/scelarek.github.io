name: Sync PEAR Meetup events

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show the start of the feed
        run: |
          curl -sL "https://www.meetup.com/portland-effective-altruism-and-rationality/events/ical/" -o feed.ics
          python - <<'PY'
          text = open("feed.ics", encoding="utf-8", errors="replace").read()
          start = text.find("BEGIN:VEVENT")
          block = text[start:start + 1500].replace("\r", "").replace("\n", " | ")
          print("::notice title=feed-head::" + text[:200].replace("\r", "").replace("\n", " | "))
          print("::notice title=first-event::" + block)
          PY
      - run: python scripts/fetch_pear_events.py
      - name: Commit if the events changed
        run: |
          if git diff --quiet -- _data/pear_events.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/pear_events.json
            git commit -m "Update PEAR events from Meetup"
            git push
          fi
